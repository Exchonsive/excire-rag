# ============================================================
# EXCIRE - GitHub Actions Cron Job
# Fungsi: Jalankan scraper + embedder otomatis tiap 2 jam
# ============================================================

name: EXCIRE RAG Scraper

on:
  schedule:
    - cron: "0 */2 * * *"   # setiap 2 jam
  workflow_dispatch:          # bisa trigger manual dari GitHub

jobs:
  scrape-and-embed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scraper & embedder
        env:
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          PINECONE_INDEX:   ${{ secrets.PINECONE_INDEX }}
        run: |
          cd rag
          python embedder.py

      - name: Log selesai
        run: echo "✅ Scrape & embed selesai - $(date '+%Y-%m-%d %H:%M:%S UTC')"
